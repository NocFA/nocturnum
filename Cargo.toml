[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://git.nocfa.net/NocFA/nocturnum"
publish = false

[workspace.dependencies]
nocturnum-core = { path = "crates/nocturnum-core" }
nocturnum-storage = { path = "crates/nocturnum-storage" }
nocturnum-index = { path = "crates/nocturnum-index" }
nocturnum-query = { path = "crates/nocturnum-query" }
nocturnum-api = { path = "crates/nocturnum-api" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["serde", "v4"] }
crc32c = "0.6"
libc = "0.2"
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
