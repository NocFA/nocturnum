[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://git.nocfa.net/NocFA/nocturnum"
publish = false

[workspace.dependencies]
nocturnum-core = { path = "crates/nocturnum-core" }
nocturnum-storage = { path = "crates/nocturnum-storage" }
nocturnum-index = { path = "crates/nocturnum-index" }
nocturnum-query = { path = "crates/nocturnum-query" }
nocturnum-api = { path = "crates/nocturnum-api" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["serde", "v4"] }
crc32c = "0.6"
bytemuck = "1.25"
memmap2 = "0.9"
libc = "0.2"
proptest = "1.11"
roaring = "0.11"
rayon = "1.11"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.27"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
serde_path_to_error = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# The recall tests build graphs over thousands of vectors, which takes minutes unoptimised.
[profile.dev.package.nocturnum-index]
opt-level = 2

[profile.dev.package.nocturnum-core]
opt-level = 2
