[package]
name = "nocturnum-storage"
description = "WAL, segments, manifest and on-disk record storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Named crash points for the crash tests, see src/crash.rs, inert unless the
# NOCTURNUM_CRASH_AT variable is set.
crash-points = []

[dependencies]
nocturnum-core.workspace = true
nocturnum-index.workspace = true
roaring.workspace = true
bytemuck.workspace = true
crc32c.workspace = true
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
nocturnum-storage = { path = ".", features = ["crash-points"] }
proptest.workspace = true
tempfile.workspace = true
